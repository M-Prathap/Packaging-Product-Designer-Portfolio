# Render web service — PARA Creative Origin portfolio
# Dashboard: https://dashboard.render.com
# Connect repo → Render reads this file automatically.

services:
  - type: web
    name: para-creative-origin
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
    disk:
      name: portfolio-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    routes:
      - type: rewrite
        source: /manage
        destination: /manage/index.html
      - type: rewrite
        source: /manage/*
        destination: /manage/index.html
      - type: rewrite
        source: /packaging
        destination: /index.html
      - type: rewrite
        source: /logo-branding
        destination: /index.html
      - type: rewrite
        source: /brochure-catalogue
        destination: /index.html
      - type: rewrite
        source: /invitation
        destination: /index.html
      - type: rewrite
        source: /banners
        destination: /index.html
      - type: rewrite
        source: /menu-card
        destination: /index.html
      - type: rewrite
        source: /videos
        destination: /index.html
      - type: rewrite
        source: /about
        destination: /index.html
      - type: rewrite
        source: /contact
        destination: /index.html
      - type: rewrite
        source: /work/*
        destination: /index.html
